email:
  from_email: system@company.com
  manager_emails:
  - manager@company.com
  password: your_app_password
  smtp_port: 587
  smtp_server: smtp.gmail.com
  use_tls: true
  username: your_email@gmail.com
gemini:
  api_key: ''
  max_tokens: 2048
  model_name: gemini-pro
  temperature: 0.7
  timeout: 30
inventory:
  check_interval: 60
  thresholds:
    COMP_B: 25
    MAT_C: 100
    TOOL_D: 20
    WIDGET_A: 50
manager:
  auto_approve_threshold: 1000.0
oracle:
  host: localhost
  max_connections: 10
  min_connections: 2
  password: password
  port: 1521
  service_name: ORCL
  username: inventory
redis:
  db: 0
  password: null
  url: redis://localhost:6379
stock_manager:
  offer_timeout: 300
  selection_criteria:
    price_weight: 0.4
    reliability_weight: 0.3
    speed_weight: 0.3
